<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LeadFlow Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-logo">Lead<span class="g">Flow</span></div>
    <div class="login-sub">Platforma za upravljanje leadovima</div>
    <div class="login-avatars" id="loginAvatars"></div>
    <div class="login-field">
      <label>Lozinka</label>
      <input type="password" id="loginPass" placeholder="Unesi lozinku...">
    </div>
    <button class="login-btn" id="doLogin">Prijavi se</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div class="app-layout" id="appLayout">
  <!-- Left Sidebar -->
  <div class="sidebar" id="sidebarIcons"></div>

  <!-- Main Area -->
  <div class="main-area">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="topTitle"></div>
        <div class="topbar-bc" id="topBC"></div>
      </div>
      <div class="topbar-right">
        <button class="tb-btn" onclick="toggleAIRight()">🤖 AI Mentor</button>
        <div class="topbar-avatar" id="topAvatar"></div>
      </div>
    </div>
    <div class="content-scroll" id="contentScroll"></div>
  </div>

  <!-- Right Sidebar — AI Mentor -->
  <div class="sidebar-right" id="sidebarRight">
    <div class="ai-header">
      <div class="ai-avatar">🤖</div>
      <div class="ai-title">
        <div class="ai-title-text" id="topAvatarTitle"></div>
        <div class="ai-title-sub">AI Mentor</div>
      </div>
      <div class="ai-dot"></div>
    </div>
    <div class="ai-tabs" id="aiTabs"></div>
    <div class="ai-content" id="aiContent"></div>
    <div class="ai-input-wrap">
      <textarea class="ai-input" id="aiInput" placeholder="Pitaj AI mentora..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();aiSend()}"></textarea>
      <button class="ai-send" onclick="aiSend()">➤</button>
    </div>
  </div>
</div>

<div class="toast-box" id="toastBox"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
