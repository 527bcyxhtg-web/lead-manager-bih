<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📋 Lead Manager — BiH</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#09090b;--card:#18181b;--card2:#27272a;--border:#3f3f46;--text:#fafafa;--muted:#a1a1aa;--accent:#8b5cf6;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--blue:#3b82f6;--pink:#ec4899}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:linear-gradient(135deg,#0f0520 0%,#1e0a3c 50%,#0f0520 100%);padding:40px 24px 24px;text-align:center;border-bottom:1px solid rgba(139,92,246,0.2)}
.header h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#fff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.header p{color:var(--muted);font-size:0.9rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 24px;max-width:800px;margin:0 auto}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
.stat .num{font-size:1.8rem;font-weight:700}
.stat .lbl{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.progress-wrap{padding:0 24px 16px;max-width:800px;margin:0 auto}
.progress-bar{height:8px;background:var(--card);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:99px;transition:width 0.4s ease}
.progress-text{text-align:center;font-size:0.8rem;color:var(--muted);margin-top:6px}
.controls{display:flex;gap:10px;padding:0 24px 16px;max-width:800px;margin:0 auto;flex-wrap:wrap}
.search{flex:1;min-width:200px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 16px;color:var(--text);font-size:0.9rem;font-family:inherit;outline:none}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:#52525b}
.fbtn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 16px;color:var(--muted);font-size:0.8rem;cursor:pointer;font-family:inherit;font-weight:500;transition:all 0.15s}
.fbtn:hover,.fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.list{padding:0 24px 80px;max-width:800px;margin:0 auto}
.contact{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;transition:all 0.2s}
.contact:hover{border-color:rgba(139,92,246,0.4);box-shadow:0 0 20px rgba(139,92,246,0.08)}
.contact.done{border-color:rgba(34,197,94,0.3);opacity:0.7}
.contact.in_progress{border-color:rgba(245,158,11,0.3)}
.company{font-size:1.05rem;font-weight:700;color:#fff;line-height:1.3}
.owner{font-size:0.8rem;color:var(--muted);margin-top:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:0.75rem;font-weight:500}
.badge.city{background:rgba(139,92,246,0.12);color:#c084fc}
.badge.cat{background:rgba(59,130,246,0.12);color:#60a5fa}
.badge.phone{background:rgba(34,197,94,0.12);color:#4ade80}
.badge.email{background:rgba(245,158,11,0.12);color:#fbbf24}
.badge.web{background:rgba(236,72,153,0.12);color:#f472b6}
.notes-wrap{margin-top:10px}
.notes-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:0.85rem;font-family:inherit;outline:none;resize:vertical;min-height:40px;transition:border-color 0.2s}
.notes-input:focus{border-color:var(--accent)}
.notes-input::placeholder{color:#52525b}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.abtn{border:none;border-radius:10px;padding:8px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s;display:flex;align-items:center;gap:5px}
.abtn.pending{background:rgba(139,92,246,0.15);color:#c084fc}
.abtn.pending:hover{background:var(--accent);color:#fff}
.abtn.in_progress{background:rgba(245,158,11,0.15);color:#fbbf24}
.abtn.in_progress:hover{background:var(--orange);color:#000}
.abtn.done{background:rgba(34,197,94,0.15);color:#4ade80}
.abtn.done:hover{background:var(--green);color:#000}
.abtn.called{background:rgba(236,72,153,0.15);color:#f472b6}
.abtn.called:hover{background:var(--pink);color:#fff}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--accent);border-radius:12px;padding:12px 24px;color:var(--text);font-size:0.9rem;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
.export-bar{display:flex;gap:10px;justify-content:center;padding:0 24px 20px;max-width:800px;margin:0 auto}
.expbtn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 16px;color:var(--muted);font-size:0.8rem;cursor:pointer;font-family:inherit;font-weight:500;transition:all 0.15s}
.expbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr);gap:8px;padding:16px}.stat .num{font-size:1.3rem}.header h1{font-size:1.5rem}}
</style>
</head>
<body>

</div>
<div class="stats">
<div class="stat"><div class="num" style="color:var(--accent)" id="sTotal">0</div><div class="lbl">Ukupno</div></div>

<div class="stat"><div class="num" style="color:var(--orange)" id="sProgress">0</div><div class="lbl">U toku</div></div>
<div class="stat"><div class="num" style="color:var(--green)" id="sDone">0</div><div class="lbl">Završeno</div></div>
</div>
<div class="progress-wrap">
<div class="progress-bar"><div class="progress-fill" id="pFill" style="width:0%"></div></div>
<div class="progress-text" id="pText">0% završeno</div>
</div>
<div class="controls">
<input type="text" class="search" id="search" placeholder="🔍 Pretraži firmu, grad, kategoriju...">
<button class="fbtn on" onclick="setF(this,'all')">Svi</button>
<button class="fbtn" onclick="setF(this,'pending')">Čeka</button>
<button class="fbtn" onclick="setF(this,'in_progress')">U toku</button>

<button class="fbtn" onclick="setF(this,'called')">📞 Zvali</button>
</div>
<div class="export-bar">
<button class="expbtn" onclick="exportCSV()">📥 Export CSV</button>
<button class="expbtn" onclick="exportJSON()">📥 Export JSON</button>
<button class="expbtn" onclick="resetAll()">🔄 Reset sve</button>
</div>
<div class="list" id="list"></div>
<div class="toast" id="toast"></div>

function ls(){try{return JSON.parse(localStorage.getItem(DB))||{}}catch(e){return{}}}
function ss(s){localStorage.setItem(DB,JSON.stringify(s))}
function gc(){const st=ls();return L.map((l,i)=>{const id='c'+i;return{id,owner:[l[0],l[1]].filter(Boolean).join(' '),company:l[2],city:l[3],category:l[4],phone:l[5],email:l[6],notes:l[7]||'',status:(st[id]||{}).status||'pending',called:(st[id]||{}).called||false,custNotes:(st[id]||{}).notes||''};})}
function uc(id,f,v){const st=ls();if(!st[id])st[id]={status:'pending',called:false,notes:''};st[id][f]=v;ss(st);}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  let d=gc();
  if(filter==='called')d=d.filter(c=>c.called);else if(filter!=='all')d=d.filter(c=>c.status===filter);
  if(q)d=d.filter(c=>(c.company+c.city+c.category+c.owner+c.custNotes).toLowerCase().includes(q));
  const all=gc(),done=all.filter(c=>c.status==='done').length,prog=all.filter(c=>c.status==='in_progress').length,pct=all.length?Math.round(done/all.length*100):0;
  document.getElementById('sTotal').textContent=all.length;
  document.getElementById('sDone').textContent=done;
  document.getElementById('sProgress').textContent=prog;
  document.getElementById('sPending').textContent=all.length-done-prog;
  document.getElementById('pFill').style.width=pct+'%';
  document.getElementById('pText').textContent=pct+'% završeno ('+done+'/'+all.length+')';
  const list=document.getElementById('list');
  if(!d.length){list.innerHTML='<div class="empty"><div style="font-size:3rem;margin-bottom:12px">📭</div><p>Nema kontakata za prikaz</p></div>';return;}
  list.innerHTML=d.map(c=>{const sc=c.status==='done'?'done':c.status==='in_progress'?'in_progress':'';return`<div class="contact ${sc}"><div><div class="company">${c.company}</div>${c.owner?'<div class="owner">'+c.owner+'</div>':''}</div><div class="meta"><span class="badge city">📍 ${c.city}</span><span class="badge cat">🏷 ${c.category}</span>${c.phone?'<span class="badge phone">📞 '+c.phone+'</span>':''}${c.email?'<span class="badge email">✉️ '+c.email+'</span>':''}</div>${c.notes?'<div style="margin-top:6px;padding:8px 12px;background:var(--card2);border-radius:8px;font-size:0.85rem;color:var(--muted)">ℹ️ '+c.notes+'</div>':''}${c.custNotes?'<div style="margin-top:6px;padding:8px 12px;background:rgba(139,92,246,0.08);border-radius:8px;font-size:0.85rem;color:#c084fc">📝 '+c.custNotes+'</div>':''}<div class="actions"><button class="abtn pending" onclick="setS('${c.id}','pending')">↩️ Čeka</button><button class="abtn in_progress" onclick="setS('${c.id}','in_progress')">⏳ U toku</button><button class="abtn done" onclick="setS('${c.id}','done')">✅ Završeno</button><button class="abtn called" onclick="tC('${c.id}')">📞 ${c.called?'Zvali':'Nazovi'}</button></div><div class="notes-wrap"><textarea class="notes-input" placeholder="Dodaj bilješku..." onblur="sN('${c.id}',this.value)">${c.custNotes||''}</textarea></div></div>`;}).join('');}
function setS(id,s){uc(id,'status',s);render();t(s==='done'?'✅ Završeno':s==='in_progress'?'⏳ U toku':'↩️ Čeka');}
function tC(id){const st=ls();const v=!((st[id]||{}).called);uc(id,'called',v);render();t(v?'📞 Zvano':'↩️ Maknuto');}
function sN(id,n){uc(id,'notes',n);}
function setF(b,f){filter=f;document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();}
function t(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2000);}
function exportCSV(){const all=gc();let csv='Firma,Vlasnik,Grad,Kategorija,Telefon,Email,Bilješke,Status,Zvali\n';all.forEach(c=>{csv+='"'+c.company+'","'+c.owner+'","'+c.city+'","'+c.category+'","'+c.phone+'","'+c.email+'","'+(c.custNotes||c.notes)+'","'+c.status+'","'+(c.called?'Da':'Ne')+'"\n';});dl('leadovi-bih.csv',csv,'text/csv');}
function exportJSON(){dl('leadovi-bih.json',JSON.stringify(gc(),null,2),'application/json');}
function dl(n,c,t){const b=new Blob([c],{type:t}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);t('📥 Preuzeto: '+n);}
function resetAll(){if(confirm('Resetovati sve statuse?')){localStorage.removeItem(DB);render();t('🔄 Sve resetovano');}}
document.getElementById('search').addEventListener('input',render);
render();
</script>
